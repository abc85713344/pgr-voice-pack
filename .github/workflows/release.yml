name: 发布 Release

# 推送形如 v2026.09.24 的 tag 时，自动用 release-notes/<tag>.md 创建 Release。
# 使用 GitHub 自动注入的 GITHUB_TOKEN，无需配置任何 Personal Access Token。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          NOTES="release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            echo "使用说明文件: $NOTES"
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES"
          else
            echo "未找到 $NOTES，改用自动生成的说明"
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
